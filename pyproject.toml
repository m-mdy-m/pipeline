[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-runner"
version = "1.1.1"
description = "A provider-neutral task runner and reusable CI workflow toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "m-mdy-m" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]

[project.scripts]
pipeline = "pipeline.core.cli:main"
pipeline-local = "pipeline.providers.local.adapter:main"
pipeline-github = "pipeline.providers.github.adapter:main"
pipeline-gitlab = "pipeline.providers.gitlab.adapter:main"
pipeline-benchmark = "pipeline.benchmark.runner:main"
pipeline-build-release = "pipeline.release.build_cli:main"
pipeline-release-target = "pipeline.release.target_cli:main"
pipeline-source-release = "pipeline.release.cli:main"
pipeline-verify-source-release = "pipeline.release.verify_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
