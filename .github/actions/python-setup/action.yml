name: Pipeline Python setup
description: Set up the Python runtime used by Pipeline helper commands.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.12"

outputs:
  python-version:
    description: Resolved Python version.
    value: ${{ steps.setup.outputs.python-version }}

runs:
  using: composite
  steps:
    - name: Set up Python
      id: setup
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
