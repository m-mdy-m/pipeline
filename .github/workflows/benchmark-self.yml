name: Pipeline Self Benchmark

on:
  push:
    branches: [main, develop]
    paths:
      - "Makefile"
      - "README.md"
      - "CHANGELOG.md"
      - "pipeline.toml"
      - "scripts/pipeline.py"
      - "scripts/pipeline_core/**"
      - "scripts/pipeline_release/**"
      - "scripts/providers/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-runtime:
    name: Repeated shared-pipeline check timing
    uses: ./.github/workflows/benchmark.yml
    with:
      category: startup
      repetitions: 5
      benchmark-command: python scripts/providers/github/adapter.py task check --json

  catalog-size:
    name: Tracked source and workflow size
    uses: ./.github/workflows/benchmark.yml
    with:
      category: size
      repetitions: 5
      benchmark-command: |
        printf 'tracked_files='
        git ls-files | wc -l
        printf 'tracked_bytes='
        git ls-files -z | xargs -0 wc -c | awk 'END { print $1 }'
        printf 'workflow_files='
        find .github/workflows -maxdepth 1 -type f | wc -l
