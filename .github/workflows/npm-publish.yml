name: npm Publish

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
      node-version:
        required: false
        type: string
        default: "22"
      registry-url:
        required: false
        type: string
        default: "https://registry.npmjs.org"
      dry-run:
        description: "Test and package the npm project without publishing"
        required: false
        type: boolean
        default: false
    secrets:
      npm-token:
        required: false

permissions:
  contents: read

jobs:
  publish:
    if: inputs.dry-run == true || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}
      - name: Install, test, and build
        working-directory: ${{ inputs.working-directory }}
        run: |
          npm ci
          npm test --if-present
          npm run build --if-present
          npm pack --dry-run
      - name: Publish stable or prerelease
        if: inputs.dry-run != true
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
