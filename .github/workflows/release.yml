name: GitHub Release

on:
  workflow_call:
    inputs:
      build-command:
        required: true
        type: string
      test-command:
        description: "Required test command; release is blocked if tests fail"
        required: true
        type: string
      artifact-path:
        description: "Files to upload, glob accepted"
        required: false
        type: string
        default: "dist/*"
      working-directory:
        required: false
        type: string
        default: "."
    secrets:
      release-token:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a version tag
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo "Release workflow requires a v* tag"; exit 1; }
      - name: Run release tests
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}
      - name: Build release artifacts
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}
      - name: Verify artifacts exist
        shell: bash
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: |
          compgen -G "$ARTIFACT_PATH" >/dev/null || { echo "No artifacts matched: $ARTIFACT_PATH"; exit 1; }
      - name: Generate checksums
        shell: bash
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: |
          mkdir -p release-assets
          while IFS= read -r -d '' file; do cp "$file" release-assets/; done < <(find . -path "./$ARTIFACT_PATH" -type f -print0 2>/dev/null || true)
          if [ -z "$(find release-assets -type f -print -quit)" ]; then
            for file in $ARTIFACT_PATH; do [ -f "$file" ] && cp "$file" release-assets/; done
          fi
          test -n "$(find release-assets -type f -print -quit)" || { echo "No release files copied"; exit 1; }
          (cd release-assets && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.release-token || github.token }}
