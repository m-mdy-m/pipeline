name: GitHub Release

on:
  workflow_call:
    inputs:
      pipeline-ref:
        description: "Version or commit of m-mdy-m/pipeline that provides the release helper"
        required: false
        type: string
        default: main
      test-command:
        description: "Test command; every matrix target must pass before publishing"
        required: true
        type: string
      build-command:
        description: "Build command used when a matrix target does not override it"
        required: true
        type: string
      artifact-path:
        description: "Artifact glob relative to the repository root"
        required: false
        type: string
        default: "dist/*"
      artifact-test-command:
        description: "Optional command that inspects the downloaded artifact on the target runner"
        required: false
        type: string
        default: ""
      e2e-setup-command:
        description: "Optional project-owned command to provision an emulator, simulator, device, or test service before E2E"
        required: false
        type: string
        default: ""
      e2e-test-command:
        description: "Optional project-owned E2E command; runs on the same matrix runner after the artifact is downloaded"
        required: false
        type: string
        default: ""
      working-directory:
        description: "Working directory for test and build commands"
        required: false
        type: string
        default: "."
      changelog-path:
        description: "Changelog path relative to the repository root"
        required: false
        type: string
        default: "CHANGELOG.md"
      go-version:
        description: "Optional Go version to install for Go-based release builds"
        required: false
        type: string
        default: ""
      setup-node:
        description: "Install Node.js for projects with frontend build steps"
        required: false
        type: boolean
        default: false
      node-version:
        description: "Node.js version to install when setup-node is enabled"
        required: false
        type: string
        default: "22"
      pnpm-version:
        description: "Optional pnpm version to activate when setup-node is enabled"
        required: false
        type: string
        default: ""
      build-matrix-json:
        description: 'JSON matrix object, e.g. {"include":[{"id":"linux-x64","os":"ubuntu-latest"}]}'
        required: false
        type: string
        default: '{"include":[{"id":"linux-x64","os":"ubuntu-latest"}]}'
      dry-run:
        description: "Build and prepare release notes but do not publish a GitHub Release"
        required: false
        type: boolean
        default: false
      asset-profile:
        description: "Release asset layout: standard preserves current output; gitea adds XZ variants, per-file checksums, and a manifest"
        required: false
        type: string
        default: "standard"
      sign-assets:
        description: "Create keyless Sigstore signatures for published assets"
        required: false
        type: boolean
        default: false
      gpg-signing:
        description: "Also create detached GPG signatures; requires gpg-private-key"
        required: false
        type: boolean
        default: false
      attest-release:
        description: "Create a GitHub artifact attestation and attach its JSON bundle to the release"
        required: false
        type: boolean
        default: false
      require-signed-tag:
        description: "Require a valid signed Git tag using the supplied tag-verification-key secret"
        required: false
        type: boolean
        default: false
    secrets:
      release-token:
        description: "Optional token used to publish the GitHub Release"
        required: false
      mobile-server-url:
        description: "Optional HTTPS endpoint passed to project-owned mobile build and E2E commands"
        required: false
      gpg-private-key:
        description: "Optional ASCII-armored GPG private key used for detached .asc signatures"
        required: false
      gpg-passphrase:
        description: "Optional passphrase for gpg-private-key"
        required: false
      tag-verification-key:
        description: "ASCII-armored public key used to verify a signed release tag"
        required: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate tag and prepare release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out the shared release helper
        uses: actions/checkout@v7
        with:
          repository: m-mdy-m/pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.pipeline/.github/actions/python-setup
        with:
          python-version: "3.12"

      - name: Validate build target catalogue and matrix configuration
        env:
          PYTHONPATH: .pipeline/src
          BUILD_MATRIX_JSON: ${{ inputs.build-matrix-json }}
          DEFAULT_E2E_TEST_COMMAND: ${{ inputs.e2e-test-command }}
        shell: bash
        run: python -m pipeline.release.matrix_cli validate "$BUILD_MATRIX_JSON" --default-e2e-test-command "$DEFAULT_E2E_TEST_COMMAND"

      - name: Validate release asset and signature options
        env:
          ASSET_PROFILE: ${{ inputs.asset-profile }}
          ATTEST_RELEASE: ${{ inputs.attest-release }}
          REQUIRE_SIGNED_TAG: ${{ inputs.require-signed-tag }}
          SIGN_ASSETS: ${{ inputs.sign-assets }}
          GPG_SIGNING: ${{ inputs.gpg-signing }}
          GPG_PRIVATE_KEY: ${{ secrets.gpg-private-key }}
          TAG_VERIFICATION_KEY: ${{ secrets.tag-verification-key }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ASSET_PROFILE" in standard|gitea) ;; *) echo "asset-profile must be standard or gitea" >&2; exit 2 ;; esac
          if [[ "$ATTEST_RELEASE" == "true" && "$ASSET_PROFILE" != "gitea" ]]; then
            echo "attest-release requires asset-profile: gitea (manifest.json is the attestation subject)." >&2
            exit 2
          fi
          if [[ "$GPG_SIGNING" == "true" && "$SIGN_ASSETS" != "true" ]]; then
            echo "gpg-signing requires sign-assets: true." >&2
            exit 2
          fi
          if [[ "$GPG_SIGNING" == "true" && -z "$GPG_PRIVATE_KEY" ]]; then
            echo "gpg-signing requires the gpg-private-key secret." >&2
            exit 2
          fi
          if [[ "$REQUIRE_SIGNED_TAG" == "true" && -z "$TAG_VERIFICATION_KEY" ]]; then
            echo "require-signed-tag requires the tag-verification-key secret." >&2
            exit 2
          fi

      - name: Normalize the GitHub event context
        env:
          PYTHONPATH: .pipeline/src
        run: python -m pipeline.providers.github bootstrap

      - name: Verify the signed release tag
        if: inputs.require-signed-tag
        env:
          TAG_NAME: ${{ github.ref_name }}
          TAG_VERIFICATION_KEY: ${{ secrets.tag-verification-key }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TAG_VERIFICATION_KEY" | gpg --batch --import
          git verify-tag "$TAG_NAME"

      - name: Validate the ref and prepare release notes
        id: version
        env:
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
          DRY_RUN: ${{ inputs.dry-run }}
          PYTHONPATH: .pipeline/src
        shell: bash
        run: |
          set -euo pipefail
          python -m pipeline.release.build_cli prepare \
            --changelog "$CHANGELOG_PATH" \
            --output-directory release-preparation \
            --dry-run "$DRY_RUN"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("release-preparation/release-meta.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={metadata['version']}\n")
              output.write(f"release_tag={metadata['release_tag']}\n")
              output.write(f"prerelease={str(metadata['prerelease']).lower()}\n")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-preparation/release-notes.md
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: release-preparation/release-meta.json
          if-no-files-found: error
          retention-days: 3

  build:
    name: Build / test ${{ matrix.id }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.build-matrix-json) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out the shared release target runner
        uses: actions/checkout@v7
        with:
          repository: m-mdy-m/pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.pipeline/.github/actions/python-setup
        with:
          python-version: "3.12"

      - name: Start release target
        shell: bash
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          printf '[%s] Starting release target %s on %s/%s\n' "$(date -u +%FT%TZ)" "$TARGET_ID" "$RUNNER_OS" "$RUNNER_ARCH"

      - name: Set up Go
        if: inputs.go-version != ''
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      # Some matrix targets (for example, Android/Gradle) need a JDK in
      # addition to Go and Node. Keep it opt-in per target to avoid installing
      # Java on unrelated Linux, macOS, Windows, and Web jobs.
      - name: Set up Java
        if: matrix.java_version != null && matrix.java_version != ''
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.java_distribution || 'temurin' }}
          java-version: ${{ matrix.java_version }}

      - name: Set up Node.js
        if: inputs.setup-node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Activate pnpm
        if: inputs.setup-node && inputs.pnpm-version != ''
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Set up MSYS2 toolchain
        id: msys2
        if: runner.os == 'Windows' && matrix.msys2_msystem != null
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys2_msystem }}
          path-type: inherit
          update: false
          # The action prunes its package cache with paccache; MSYS2 ships it in pacman-contrib.
          install: pacman-contrib ${{ matrix.msys2_packages }}

      # Keep runner-context checks in step-level if conditions. The runner context
      # is not available while evaluating the shell property. The shared src runner
      # streams child stdout/stderr as it is produced and writes a stage report.
      - name: Run tests (MSYS2)
        id: test_msys2
        if: runner.os == 'Windows' && matrix.msys2_msystem != null
        shell: msys2 {0}
        env:
          PYTHONPATH: .pipeline/src
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          TARGET_ID: ${{ matrix.id }}
          PIPELINE_RELEASE_COMMAND: ${{ matrix.test_command || inputs.test-command }}
          RELEASE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: python -m pipeline.release.target_cli run --target "$TARGET_ID" --stage test --working-directory "$RELEASE_WORKING_DIRECTORY"

      - name: Run tests
        id: test_bash
        if: runner.os != 'Windows' || matrix.msys2_msystem == null
        shell: bash
        env:
          PYTHONPATH: .pipeline/src
          TARGET_ID: ${{ matrix.id }}
          PIPELINE_RELEASE_COMMAND: ${{ matrix.test_command || inputs.test-command }}
          RELEASE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: python -m pipeline.release.target_cli run --target "$TARGET_ID" --stage test --working-directory "$RELEASE_WORKING_DIRECTORY"

      - name: Build release artifacts (MSYS2)
        id: build_msys2
        if: runner.os == 'Windows' && matrix.msys2_msystem != null
        shell: msys2 {0}
        env:
          PYTHONPATH: .pipeline/src
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          TARGET_ID: ${{ matrix.id }}
          PIPELINE_RELEASE_COMMAND: ${{ matrix.build_command || inputs.build-command }}
          PIPELINE_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          IDIOS_MOBILE_SERVER_URL: ${{ secrets['mobile-server-url'] }}
          RELEASE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: python -m pipeline.release.target_cli run --target "$TARGET_ID" --stage build --working-directory "$RELEASE_WORKING_DIRECTORY"

      - name: Build release artifacts
        id: build_bash
        if: runner.os != 'Windows' || matrix.msys2_msystem == null
        shell: bash
        env:
          PYTHONPATH: .pipeline/src
          TARGET_ID: ${{ matrix.id }}
          PIPELINE_RELEASE_COMMAND: ${{ matrix.build_command || inputs.build-command }}
          PIPELINE_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          IDIOS_MOBILE_SERVER_URL: ${{ secrets['mobile-server-url'] }}
          RELEASE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: python -m pipeline.release.target_cli run --target "$TARGET_ID" --stage build --working-directory "$RELEASE_WORKING_DIRECTORY"

      - name: Upload artifacts for this build target
        uses: actions/upload-artifact@v7
        with:
          name: release-build-${{ matrix.id }}
          path: ${{ matrix.artifact_path || inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 14

      # Artifact storage downloads can fail transiently after a successful upload.
      # Keep each attempt isolated so a partial extraction cannot contaminate a retry.
      - name: Download artifacts for native verification (attempt 1)
        id: download_artifacts
        if: inputs.artifact-test-command != '' || matrix.artifact_test_command != null || inputs.e2e-setup-command != '' || matrix.e2e_setup_command != null || inputs.e2e-test-command != '' || matrix.e2e_test_command != null
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: release-build-${{ matrix.id }}
          path: ${{ runner.temp }}/release-artifact-test-1

      - name: Retry artifact download (attempt 2)
        id: download_artifacts_retry_2
        if: (inputs.artifact-test-command != '' || matrix.artifact_test_command != null || inputs.e2e-setup-command != '' || matrix.e2e_setup_command != null || inputs.e2e-test-command != '' || matrix.e2e_test_command != null) && steps.download_artifacts.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: release-build-${{ matrix.id }}
          path: ${{ runner.temp }}/release-artifact-test-2

      - name: Retry artifact download (attempt 3)
        id: download_artifacts_retry_3
        if: (inputs.artifact-test-command != '' || matrix.artifact_test_command != null || inputs.e2e-setup-command != '' || matrix.e2e_setup_command != null || inputs.e2e-test-command != '' || matrix.e2e_test_command != null) && steps.download_artifacts.outcome != 'success' && steps.download_artifacts_retry_2.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: release-build-${{ matrix.id }}
          path: ${{ runner.temp }}/release-artifact-test-3

      - name: Fail when native-verification artifact could not be downloaded
        if: (inputs.artifact-test-command != '' || matrix.artifact_test_command != null || inputs.e2e-setup-command != '' || matrix.e2e_setup_command != null || inputs.e2e-test-command != '' || matrix.e2e_test_command != null) && steps.download_artifacts.outcome != 'success' && steps.download_artifacts_retry_2.outcome != 'success' && steps.download_artifacts_retry_3.outcome != 'success'
        shell: bash
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          echo "::error title=Artifact download failed::${TARGET_ID}: all three download attempts failed. Check the Actions artifact-storage service and runner network."
          exit 1

      - name: Run artifact tests (MSYS2)
        id: artifact_test_msys2
        if: runner.os == 'Windows' && (inputs.artifact-test-command != '' || matrix.artifact_test_command != null) && (steps.download_artifacts.outcome == 'success' || steps.download_artifacts_retry_2.outcome == 'success' || steps.download_artifacts_retry_3.outcome == 'success')
        shell: msys2 {0}
        env:
          PYTHONPATH: .pipeline/src
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          TARGET_ID: ${{ matrix.id }}
          PIPELINE_RELEASE_COMMAND: ${{ matrix.artifact_test_command || inputs.artifact-test-command }}
          RELEASE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PIPELINE_ARTIFACT_TEST_DIR: ${{ steps.download_artifacts.outcome == 'success' && format('{0}/release-artifact-test-1', runner.temp) || steps.download_artifacts_retry_2.outcome == 'success' && format('{0}/release-artifact-test-2', runner.temp) || format('{0}/release-artifact-test-3', runner.temp) }}
        run: python -m pipeline.release.target_cli run --target "$TARGET_ID" --stage artifact-test --working-directory "$RELEASE_WORKING_DIRECTORY"

      - name: Run artifact tests
        id: artifact_test_bash
        if: runner.os != 'Windows' && (inputs.artifact-test-command != '' || matrix.artifact_test_command != null) && (steps.download_artifacts.outcome == 'success' || steps.download_artifacts_retry_2.outcome == 'success' || steps.download_artifacts_retry_3.outcome == 'success')
        shell: bash
        env:
          PYTHONPATH: .pipeline/src
          TARGET_ID: ${{ matrix.id }}
          PIPELINE_RELEASE_COMMAND: ${{ matrix.artifact_test_command || inputs.artifact-test-command }}
          RELEASE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PIPELINE_ARTIFACT_TEST_DIR: ${{ steps.download_artifacts.outcome == 'success' && format('{0}/release-artifact-test-1', runner.temp) || steps.download_artifacts_retry_2.outcome == 'success' && format('{0}/release-artifact-test-2', runner.temp) || format('{0}/release-artifact-test-3', runner.temp) }}
        run: python -m pipeline.release.target_cli run --target "$TARGET_ID" --stage artifact-test --working-directory "$RELEASE_WORKING_DIRECTORY"

      - name: Validate E2E command selection
        shell: bash
        env:
          E2E_SETUP_COMMAND: ${{ matrix.e2e_setup_command || inputs.e2e-setup-command }}
          E2E_TEST_COMMAND: ${{ matrix.e2e_test_command || inputs.e2e-test-command }}
          TARGET_ID: ${{ matrix.id }}
        run: |
          if [[ -n "$E2E_SETUP_COMMAND" && -z "$E2E_TEST_COMMAND" ]]; then
            echo "::error title=Invalid E2E configuration::${TARGET_ID} defines an E2E setup command but no E2E test command."
            exit 2
          fi

      - name: Prepare E2E environment (MSYS2)
        id: e2e_setup_msys2
        if: runner.os == 'Windows' && matrix.msys2_msystem != null && (inputs.e2e-setup-command != '' || matrix.e2e_setup_command != null) && (steps.download_artifacts.outcome == 'success' || steps.download_artifacts_retry_2.outcome == 'success' || steps.download_artifacts_retry_3.outcome == 'success')
        shell: msys2 {0}
        env:
          PYTHONPATH: .pipeline/src
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          TARGET_ID: ${{ matrix.id }}
          IDIOS_MOBILE_SERVER_URL: ${{ secrets['mobile-server-url'] }}
          PIPELINE_RELEASE_COMMAND: ${{ matrix.e2e_setup_command || inputs.e2e-setup-command }}
          RELEASE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PIPELINE_ARTIFACT_TEST_DIR: ${{ steps.download_artifacts.outcome == 'success' && format('{0}/release-artifact-test-1', runner.temp) || steps.download_artifacts_retry_2.outcome == 'success' && format('{0}/release-artifact-test-2', runner.temp) || format('{0}/release-artifact-test-3', runner.temp) }}
        run: python -m pipeline.release.target_cli run --target "$TARGET_ID" --stage e2e-setup --working-directory "$RELEASE_WORKING_DIRECTORY" --target-os "${{ matrix.target_os || '' }}" --architecture "${{ matrix.architecture || matrix.arch || '' }}" --abi "${{ matrix.abi || '' }}" --platform "${{ matrix.platform || '' }}"

      - name: Prepare E2E environment
        id: e2e_setup_bash
        if: runner.os != 'Windows' && (inputs.e2e-setup-command != '' || matrix.e2e_setup_command != null) && (steps.download_artifacts.outcome == 'success' || steps.download_artifacts_retry_2.outcome == 'success' || steps.download_artifacts_retry_3.outcome == 'success')
        shell: bash
        env:
          PYTHONPATH: .pipeline/src
          TARGET_ID: ${{ matrix.id }}
          IDIOS_MOBILE_SERVER_URL: ${{ secrets['mobile-server-url'] }}
          PIPELINE_RELEASE_COMMAND: ${{ matrix.e2e_setup_command || inputs.e2e-setup-command }}
          RELEASE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PIPELINE_ARTIFACT_TEST_DIR: ${{ steps.download_artifacts.outcome == 'success' && format('{0}/release-artifact-test-1', runner.temp) || steps.download_artifacts_retry_2.outcome == 'success' && format('{0}/release-artifact-test-2', runner.temp) || format('{0}/release-artifact-test-3', runner.temp) }}
        run: python -m pipeline.release.target_cli run --target "$TARGET_ID" --stage e2e-setup --working-directory "$RELEASE_WORKING_DIRECTORY" --target-os "${{ matrix.target_os || '' }}" --architecture "${{ matrix.architecture || matrix.arch || '' }}" --abi "${{ matrix.abi || '' }}" --platform "${{ matrix.platform || '' }}"

      - name: Run E2E tests (MSYS2)
        id: e2e_test_msys2
        if: runner.os == 'Windows' && matrix.msys2_msystem != null && (inputs.e2e-test-command != '' || matrix.e2e_test_command != null) && (steps.download_artifacts.outcome == 'success' || steps.download_artifacts_retry_2.outcome == 'success' || steps.download_artifacts_retry_3.outcome == 'success')
        shell: msys2 {0}
        env:
          PYTHONPATH: .pipeline/src
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          TARGET_ID: ${{ matrix.id }}
          IDIOS_MOBILE_SERVER_URL: ${{ secrets['mobile-server-url'] }}
          PIPELINE_RELEASE_COMMAND: ${{ matrix.e2e_test_command || inputs.e2e-test-command }}
          RELEASE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PIPELINE_ARTIFACT_TEST_DIR: ${{ steps.download_artifacts.outcome == 'success' && format('{0}/release-artifact-test-1', runner.temp) || steps.download_artifacts_retry_2.outcome == 'success' && format('{0}/release-artifact-test-2', runner.temp) || format('{0}/release-artifact-test-3', runner.temp) }}
        run: python -m pipeline.release.target_cli run --target "$TARGET_ID" --stage e2e-test --working-directory "$RELEASE_WORKING_DIRECTORY" --target-os "${{ matrix.target_os || '' }}" --architecture "${{ matrix.architecture || matrix.arch || '' }}" --abi "${{ matrix.abi || '' }}" --platform "${{ matrix.platform || '' }}"

      - name: Run E2E tests
        id: e2e_test_bash
        if: runner.os != 'Windows' && (inputs.e2e-test-command != '' || matrix.e2e_test_command != null) && (steps.download_artifacts.outcome == 'success' || steps.download_artifacts_retry_2.outcome == 'success' || steps.download_artifacts_retry_3.outcome == 'success')
        shell: bash
        env:
          PYTHONPATH: .pipeline/src
          TARGET_ID: ${{ matrix.id }}
          IDIOS_MOBILE_SERVER_URL: ${{ secrets['mobile-server-url'] }}
          PIPELINE_RELEASE_COMMAND: ${{ matrix.e2e_test_command || inputs.e2e-test-command }}
          RELEASE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PIPELINE_ARTIFACT_TEST_DIR: ${{ steps.download_artifacts.outcome == 'success' && format('{0}/release-artifact-test-1', runner.temp) || steps.download_artifacts_retry_2.outcome == 'success' && format('{0}/release-artifact-test-2', runner.temp) || format('{0}/release-artifact-test-3', runner.temp) }}
        run: python -m pipeline.release.target_cli run --target "$TARGET_ID" --stage e2e-test --working-directory "$RELEASE_WORKING_DIRECTORY" --target-os "${{ matrix.target_os || '' }}" --architecture "${{ matrix.architecture || matrix.arch || '' }}" --abi "${{ matrix.abi || '' }}" --platform "${{ matrix.platform || '' }}"

      - name: Report release target outcome
        if: always()
        shell: bash
        env:
          PYTHONPATH: .pipeline/src
          TARGET_ID: ${{ matrix.id }}
          TARGET_REPORT_DIR: .pipeline-artifacts/release-targets
          TEST_OUTCOME: ${{ steps.test_msys2.outcome != 'skipped' && steps.test_msys2.outcome || steps.test_bash.outcome }}
          BUILD_OUTCOME: ${{ steps.build_msys2.outcome != 'skipped' && steps.build_msys2.outcome || steps.build_bash.outcome }}
          ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download_artifacts_retry_3.outcome == 'success' && 'success' || steps.download_artifacts_retry_2.outcome == 'success' && 'success' || steps.download_artifacts.outcome }}
          ARTIFACT_TEST_OUTCOME: ${{ steps.artifact_test_msys2.outcome != 'skipped' && steps.artifact_test_msys2.outcome || steps.artifact_test_bash.outcome }}
          E2E_SETUP_OUTCOME: ${{ steps.e2e_setup_msys2.outcome != 'skipped' && steps.e2e_setup_msys2.outcome || steps.e2e_setup_bash.outcome }}
          E2E_TEST_OUTCOME: ${{ steps.e2e_test_msys2.outcome != 'skipped' && steps.e2e_test_msys2.outcome || steps.e2e_test_bash.outcome }}
        run: |
          set -u
          report="$TARGET_REPORT_DIR/$TARGET_ID/summary.md"
          if command -v python >/dev/null 2>&1; then
            python -m pipeline.release.target_cli report --target "$TARGET_ID" --report-directory "$TARGET_REPORT_DIR" --output "$report" || true
          fi
          {
            if [[ -s "$report" ]]; then
              cat "$report"
              printf '\n'
            else
              printf '## Release target: %s\n\nNo source-level stage report was produced.\n\n' "$TARGET_ID"
            fi
            printf '### GitHub Actions stage outcomes\n\n| Stage | Outcome |\n| --- | --- |\n| Test | %s |\n| Build | %s |\n| Artifact download | %s |\n| Downloaded artifact test | %s |\n| E2E setup | %s |\n| E2E test | %s |\n' "$TEST_OUTCOME" "$BUILD_OUTCOME" "$ARTIFACT_DOWNLOAD_OUTCOME" "$ARTIFACT_TEST_OUTCOME" "$E2E_SETUP_OUTCOME" "$E2E_TEST_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$TEST_OUTCOME" == "failure" ]]; then
            echo "::error title=Release target test failed::${TARGET_ID}: test stage failed; see the Run tests step output."
          fi
          if [[ "$BUILD_OUTCOME" == "failure" ]]; then
            echo "::error title=Release target build failed::${TARGET_ID}: build stage failed; see the Build release artifacts step output."
          fi
          if [[ "$ARTIFACT_DOWNLOAD_OUTCOME" == "failure" ]]; then
            echo "::error title=Release artifact download failed::${TARGET_ID}: the artifact could not be downloaded after three attempts."
          fi
          if [[ "$ARTIFACT_TEST_OUTCOME" == "failure" ]]; then
            echo "::error title=Downloaded release artifact test failed::${TARGET_ID}: the native artifact test failed; publishing is blocked."
          fi
          if [[ "$E2E_SETUP_OUTCOME" == "failure" ]]; then
            echo "::error title=E2E environment setup failed::${TARGET_ID}: the E2E setup command failed; publishing is blocked."
          fi
          if [[ "$E2E_TEST_OUTCOME" == "failure" ]]; then
            echo "::error title=E2E test failed::${TARGET_ID}: the configured E2E command failed; publishing is blocked."
          fi

      - name: Upload target diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-diagnostics-${{ matrix.id }}
          path: .pipeline-artifacts/release-targets/${{ matrix.id }}/
          if-no-files-found: warn
          retention-days: 14

  assemble:
    name: Assemble artifacts and verify checksums
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: release-notes

      - uses: actions/download-artifact@v7
        with:
          name: release-metadata
          path: release-metadata

      - uses: actions/download-artifact@v7
        with:
          pattern: release-build-*
          path: release-assets
          merge-multiple: false

      - name: Check out the shared release helper
        uses: actions/checkout@v7
        with:
          repository: m-mdy-m/pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Assemble the selected release asset profile
        uses: ./.pipeline/.github/actions/release-assets
        with:
          mode: assemble
          assets-directory: release-assets
          asset-profile: ${{ inputs.asset-profile }}
          metadata-path: release-metadata/release-meta.json

      - name: Verify assembled release assets
        uses: ./.pipeline/.github/actions/release-assets
        with:
          mode: verify
          assets-directory: release-assets

      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            release-assets/
            release-notes/release-notes.md
          if-no-files-found: error
          retention-days: 14

  sign-and-attest:
    name: Sign assets and create release provenance
    needs: [prepare, build, assemble]
    if: inputs.dry-run != true && (inputs.sign-assets || inputs.attest-release)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: .

      - name: Check out the shared release verifier
        uses: actions/checkout@v7
        with:
          repository: m-mdy-m/pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Install Cosign
        if: inputs.sign-assets
        uses: sigstore/cosign-installer@v4.1.2

      - name: Import optional GPG signing key
        id: import-gpg
        if: inputs.sign-assets && inputs.gpg-signing
        uses: crazy-max/ghaction-import-gpg@v7.0.0
        with:
          gpg_private_key: ${{ secrets.gpg-private-key }}
          passphrase: ${{ secrets.gpg-passphrase }}

      - name: Sign release assets with Sigstore and optional GPG
        if: inputs.sign-assets
        env:
          GPG_FINGERPRINT: ${{ steps.import-gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.gpg-passphrase }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in release-assets/*; do
            [[ -f "$file" ]] || continue
            case "$file" in
              *.asc|*.sigstore.json|*/SHA256SUMS) continue ;;
            esac
            cosign sign-blob "$file" --bundle "$file.sigstore.json" --yes
            if [[ -n "$GPG_FINGERPRINT" ]]; then
              printf '%s' "$GPG_PASSPHRASE" | gpg --pinentry-mode loopback \
                --passphrase-fd 0 --batch --yes --armor --detach-sign \
                -u "$GPG_FINGERPRINT" --output "$file.asc" "$file"
            fi
          done

      - name: Create GitHub release attestation
        id: attest
        if: inputs.attest-release
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: release-assets/manifest.json

      - name: Attach the attestation bundle and finalize checksums
        if: inputs.attest-release || inputs.sign-assets
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ATTESTATION_BUNDLE" ]]; then
            test -s "$ATTESTATION_BUNDLE"
            cp "$ATTESTATION_BUNDLE" release-assets/release-attestation.json
          fi
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("release-assets")
          for path in sorted(root.iterdir()):
              if not path.is_file() or path.name == "SHA256SUMS" or path.name.endswith(".sha256"):
                  continue
              sidecar = path.with_name(path.name + ".sha256")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              sidecar.write_text(f"{digest}  {path.name}\n", encoding="ascii")

          files = sorted(
              (path for path in root.iterdir() if path.is_file() and path.name != "SHA256SUMS"),
              key=lambda path: path.name,
          )
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}"
              for path in files
          ]
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY

      - name: Verify signed and attested release assets
        uses: ./.pipeline/.github/actions/release-assets
        with:
          mode: verify
          assets-directory: release-assets

      - uses: actions/upload-artifact@v7
        with:
          name: release-publish-bundle
          path: |
            release-assets/
            release-notes/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release and attach assets
    needs: [prepare, build, assemble, sign-and-attest]
    if: >-
      inputs.dry-run != true &&
      always() &&
      needs.prepare.result == 'success' &&
      needs.build.result == 'success' &&
      needs.assemble.result == 'success' &&
      (needs.sign-and-attest.result == 'success' || needs.sign-and-attest.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        if: needs.sign-and-attest.result == 'success'
        with:
          name: release-publish-bundle
          path: .

      - uses: actions/download-artifact@v7
        if: needs.sign-and-attest.result == 'skipped'
        with:
          name: release-bundle
          path: .

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ needs.prepare.outputs.version }}
          body_path: release-notes/release-notes.md
          files: |
            release-assets/**
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease != 'true' }}
          token: ${{ secrets.release-token || github.token }}
