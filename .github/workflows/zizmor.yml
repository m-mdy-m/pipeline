name: GitHub Actions security analysis

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  zizmor:
    name: Audit workflows and local actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out workflow sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze GitHub Actions with zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .
          collect: all
          persona: regular
          min-severity: high
          min-confidence: high
          advanced-security: "false"
          annotations: "true"
