name: Release on version tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish the tagged version
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      pipeline-ref: ${{ github.ref_name }}
      test-command: PYTHONPATH=src python -m pipeline.providers.github task check --json
      build-command: |
        set -euo pipefail
        mkdir -p dist
        git archive --format=tar.gz \
          --prefix="pipeline-${GITHUB_REF_NAME}/" \
          --output="dist/pipeline-${GITHUB_REF_NAME}.tar.gz" \
          "$GITHUB_SHA"
      artifact-path: dist/*
      working-directory: .
      changelog-path: CHANGELOG.md
