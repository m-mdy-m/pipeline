name: Typos

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typos:
    name: Check spelling in source and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TYPOS_VERSION: v1.51.1
      TYPOS_SHA256: 93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify typos
        shell: bash
        run: |
          set -euo pipefail
          archive="typos-${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 \
            -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/crate-ci/typos/releases/download/${TYPOS_VERSION}/${archive}"
          echo "${TYPOS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" ./typos
          chmod +x "${RUNNER_TEMP}/typos"

      - name: Check spelling
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/typos" --format brief
