name: Python Package Publish

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
      python-version:
        required: false
        type: string
        default: "3.12"
      dry-run:
        description: "Build and validate distributions without publishing to PyPI"
        required: false
        type: boolean
        default: false
    secrets:
      pypi-token:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build and validate Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build source and wheel distributions
        working-directory: ${{ inputs.working-directory }}
        run: python -m build
      - name: Validate distribution metadata
        working-directory: ${{ inputs.working-directory }}
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: ${{ inputs.working-directory }}/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish distributions to PyPI
    if: inputs.dry-run != true && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.pypi-token }}
