name: Docker Hub Publish

on:
  workflow_call:
    inputs:
      image:
        description: "Docker Hub image, e.g. owner/project-sdk"
        required: true
        type: string
      context:
        required: false
        type: string
        default: "."
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      sdk-image:
        description: "Set true for an SDK/build environment image (not a service)"
        required: false
        type: boolean
        default: false
      dry-run:
        description: "Build the image without logging in or pushing it"
        required: false
        type: boolean
        default: false
    secrets:
      username:
        required: false
      token:
        required: false

permissions:
  contents: read

jobs:
  publish:
    if: inputs.dry-run == true || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: inputs.dry-run != true
        with:
          username: ${{ secrets.username }}
          password: ${{ secrets.token }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.dry-run != true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PSX_ALL_IMAGE_KIND=${{ inputs.sdk-image && 'sdk' || 'service-or-app' }}
