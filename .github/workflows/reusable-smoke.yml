name: Reusable Workflow Dry Run

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "src/**"
      - "tests/**"
      - "examples/workflow-smoke/**"
      - "pyproject.toml"
      - "pipeline.toml"
      - "Makefile"
      - "CHANGELOG.md"
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "src/**"
      - "tests/**"
      - "examples/workflow-smoke/**"
      - "examples/toolchains/**"
      - "pyproject.toml"
      - "pipeline.toml"
      - "Makefile"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    name: Reusable Python CI
    uses: ./.github/workflows/ci.yml
    with:
      language: python
      python-version: "3.12"
      pipeline-ref: ${{ github.sha }}
      build-command: PYTHONPATH=src python -m compileall -q src
      test-command: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -v

  docs:
    permissions:
      contents: read
    name: Reusable documentation check
    uses: ./.github/workflows/docs-check.yml

  security:
    permissions:
      contents: read
    name: Reusable secret scan
    uses: ./.github/workflows/security-check.yml
    with:
      scan-path: src

  benchmark:
    permissions:
      contents: read
    name: Reusable benchmark dry run
    uses: ./.github/workflows/benchmark.yml
    with:
      pipeline-ref: ${{ github.sha }}
      category: startup
      repetitions: 2
      benchmark-command: PYTHONPATH=src python -m pipeline.providers.github task check --json

  release-dry-run:
    permissions:
      contents: write
      id-token: write
      attestations: write
    name: Reusable build release dry run
    uses: ./.github/workflows/release.yml
    with:
      pipeline-ref: ${{ github.sha }}
      test-command: PYTHONPATH=src python -m pipeline.providers.github task check --json
      build-command: |
        set -euo pipefail
        mkdir -p dist
        printf 'pipeline reusable release dry run\n' > dist/workflow-smoke.txt
      artifact-path: dist/*
      changelog-path: CHANGELOG.md
      asset-profile: gitea
      dry-run: true

  source-release-dry-run:
    permissions:
      contents: write
    name: Reusable source release dry run
    uses: ./.github/workflows/source-release.yml
    with:
      pipeline-ref: ${{ github.sha }}
      changelog-path: CHANGELOG.md
      changelog-missing-policy: fail
      changelog-asset-mode: archive-and-asset
      source-submodules: fail-if-present
      dry-run: true

  docker-dry-run:
    permissions:
      contents: read
    name: Reusable Docker build without push
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: local/pipeline-workflow-smoke
      context: examples/workflow-smoke/docker
      dockerfile: examples/workflow-smoke/docker/Dockerfile
      dry-run: true

  npm-dry-run:
    permissions:
      contents: read
    name: Reusable npm package dry run
    uses: ./.github/workflows/npm-publish.yml
    with:
      working-directory: examples/workflow-smoke/npm
      node-version: "22"
      dry-run: true

  python-package-dry-run:
    permissions:
      contents: read
    name: Reusable Python package dry run
    uses: ./.github/workflows/python-publish.yml
    with:
      python-version: "3.12"
      dry-run: true

  oci-package-dry-run:
    permissions:
      contents: read
      packages: write
      packages: write
    name: Reusable OCI package preparation without GHCR push
    uses: ./.github/workflows/oci-publish.yml
    with:
      pipeline-ref: ${{ github.sha }}
      package-name: pipeline-oci-smoke
      component-id: pipeline-smoke
      variant: default
      version: 0.0.0-dev.1
      build-command: |
        set -euo pipefail
        mkdir -p dist
        printf 'pipeline OCI package smoke\\n' > dist/package-content.txt
        tar -czf dist/pipeline-oci-smoke.tar.gz -C dist package-content.txt
      test-command: python -m pipeline.oci.cli validate-version --value 0.0.0-dev.1
      artifact-path: dist/pipeline-oci-smoke.tar.gz
      artifact-test-command: >-
        python -m pipeline.oci.cli verify
        --metadata "$PIPELINE_PACKAGE_METADATA"
        --artifact "$PIPELINE_ARTIFACT_PATH"
      build-matrix-json: >-
        {"include":[{"id":"linux-amd64","os":"ubuntu-24.04","target_os":"linux","architecture":"x86_64","abi":"gnu"}]}
      dry-run: true

  pages-dry-run:
    permissions:
      contents: read
      pages: write
      id-token: write
    name: Reusable Pages build without deployment
    uses: ./.github/workflows/pages.yml
    with:
      build-command: mkdir -p dist && printf '<h1>pipeline pages dry run</h1>\n' > dist/index.html
      output-directory: dist
      dry-run: true
