name: Documentation and Workflow Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !node_modules
      - name: Validate GitHub Actions syntax and expressions
        uses: reviewdog/action-actionlint@v1
      - name: Check common project documents
        shell: bash
        run: |
          test -s README.md
          test -s LICENSE
          test -s CHANGELOG.md
          git diff --check
