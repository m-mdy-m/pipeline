name: Documentation and Workflow Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            **/*.md
            !node_modules
      - name: Validate GitHub Actions syntax and expressions
        uses: reviewdog/action-actionlint@v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check this repository's required documents and workflow inventory
        if: hashFiles('Makefile') != ''
        run: make docs-check workflow-inventory
      - name: Validate the shared task configuration through the provider adapter
        if: hashFiles('scripts/providers/github/adapter.py') != ''
        run: python scripts/providers/github/adapter.py run validate --json
      - name: Check whitespace
        run: git diff --check
