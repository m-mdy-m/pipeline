name: Documentation and Workflow Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            **/*.md
            !node_modules
      - name: Validate GitHub Actions syntax and expressions
        uses: reviewdog/action-actionlint@v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check common project documents and repository contracts
        shell: bash
        run: |
          test -s README.md
          test -s LICENSE
          test -s CHANGELOG.md
          test -s docs/SOURCE-RELEASES.md
          test -s docs/SOURCE-RELEASE-DECISIONS.md
          make check
          git diff --check
