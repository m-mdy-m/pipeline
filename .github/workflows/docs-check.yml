name: Documentation and Workflow Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            **/*.md
            !node_modules
      - name: Validate GitHub Actions syntax and expressions
        uses: reviewdog/action-actionlint@v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check pipeline repository contracts
        if: hashFiles('src/pipeline/core/cli.py') != ''
        run: make docs-check workflow-inventory
      - name: Validate the shared task configuration
        if: hashFiles('src/pipeline/providers/github/adapter.py') != ''
        env:
          PYTHONPATH: src
        run: python -m pipeline.providers.github run validate --json
      - name: Check whitespace
        run: git diff --check
