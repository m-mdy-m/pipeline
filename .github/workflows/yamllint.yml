name: YAML lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".gitlab-ci.yml"
      - ".yamllint.yml"
      - "**/*.yml"
      - "**/*.yaml"

permissions:
  contents: read

jobs:
  yamllint:
    name: Lint provider workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: python -m pip install --disable-pip-version-check "yamllint==1.37.1"

      - name: Lint GitHub and GitLab provider files
        shell: bash
        run: |
          set -euo pipefail
          paths=(.github/workflows .gitlab-ci.yml zizmor.yml .github/dependabot.yml)
          if [[ -d .github/actions ]]; then
            paths+=(.github/actions)
          fi
          yamllint --config-file .yamllint.yml "${paths[@]}"
