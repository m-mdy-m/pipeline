name: CI

on:
  workflow_call:
    inputs:
      language:
        description: "Runtime/toolchain: go, node, rust, python, java, dotnet, c, or custom"
        required: true
        type: string
      build-command:
        required: false
        type: string
        default: "make build"
      test-command:
        required: false
        type: string
        default: "make test"
      lint-command:
        required: false
        type: string
        default: ""
      working-directory:
        required: false
        type: string
        default: "."
      go-version:
        required: false
        type: string
        default: "stable"
      node-version:
        required: false
        type: string
        default: "22"
      setup-node:
        description: "Also provision Node.js for mixed-language projects"
        required: false
        type: boolean
        default: false
      pnpm-version:
        description: "Optional pnpm version to activate when setup-node is enabled"
        required: false
        type: string
        default: ""
      rust-toolchain:
        required: false
        type: string
        default: "stable"
      python-version:
        required: false
        type: string
        default: "3.12"
      java-version:
        required: false
        type: string
        default: "21"
      dotnet-version:
        required: false
        type: string
        default: "8.0.x"
      pipeline-task:
        description: "Run a task from the caller's pipeline.toml instead of build/test/lint commands"
        required: false
        type: string
        default: ""
      pipeline-ref:
        description: "Branch, tag, or commit of m-mdy-m/pipeline used for the task engine"
        required: false
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Set up Node.js
        if: inputs.language == 'node' || inputs.setup-node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Activate pnpm
        if: inputs.setup-node && inputs.pnpm-version != ''
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Set up Rust
        if: inputs.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Set up Java
        if: inputs.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up .NET
        if: inputs.language == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Set up Python
        if: inputs.language == 'python' || inputs.pipeline-task != ''
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Check out the shared pipeline task engine
        if: inputs.pipeline-task != ''
        uses: actions/checkout@v7
        with:
          repository: m-mdy-m/pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node dependencies
        if: inputs.language == 'node'
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci
          elif [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile
          fi

      - name: Install Python dependencies
        if: inputs.language == 'python' && hashFiles(format('{0}/requirements.txt', inputs.working-directory)) != ''
        run: python -m pip install -r requirements.txt

      - name: Validate reusable workflow inputs
        env:
          LANGUAGE: ${{ inputs.language }}
          BUILD_COMMAND: ${{ inputs.build-command }}
          TEST_COMMAND: ${{ inputs.test-command }}
          PIPELINE_TASK: ${{ inputs.pipeline-task }}
        shell: bash
        run: |
          set -euo pipefail
          case "$LANGUAGE" in
            go|node|rust|python|java|dotnet|c|custom) ;;
            *) echo "Unsupported language: $LANGUAGE" >&2; exit 2 ;;
          esac

          if [ -z "$PIPELINE_TASK" ]; then
            test -n "$BUILD_COMMAND" || { echo "build-command must not be empty" >&2; exit 1; }
            test -n "$TEST_COMMAND" || { echo "test-command must not be empty" >&2; exit 1; }
          else
            [[ "$PIPELINE_TASK" =~ ^[A-Za-z0-9_-]+$ ]] || {
              echo "pipeline-task must be a simple task name" >&2
              exit 2
            }
          fi

      - name: Run the caller's pipeline.toml task
        if: inputs.pipeline-task != ''
        env:
          PYTHONPATH: ${{ github.workspace }}/.pipeline/src
          PIPELINE_TASK: ${{ inputs.pipeline-task }}
        run: python -m pipeline.providers.github task "$PIPELINE_TASK" --json

      - name: Build
        if: inputs.pipeline-task == ''
        run: ${{ inputs.build-command }}

      - name: Test
        if: inputs.pipeline-task == ''
        run: ${{ inputs.test-command }}

      - name: Lint
        if: inputs.pipeline-task == '' && inputs.lint-command != ''
        run: ${{ inputs.lint-command }}
