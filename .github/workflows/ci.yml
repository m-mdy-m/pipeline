name: CI

on:
  workflow_call:
    inputs:
      language:
        description: "Runtime/toolchain: go, node, rust, python, java, dotnet, c, docker, or custom"
        required: true
        type: string
      build-command:
        required: false
        type: string
        default: "make build"
      test-command:
        required: false
        type: string
        default: "make test"
      lint-command:
        required: false
        type: string
        default: ""
      working-directory:
        required: false
        type: string
        default: "."
      go-version:
        required: false
        type: string
        default: "stable"
      node-version:
        required: false
        type: string
        default: "22"
      setup-node:
        description: "Also provision Node.js for mixed-language projects"
        required: false
        type: boolean
        default: false
      pnpm-version:
        description: "Optional pnpm version to activate when setup-node is enabled"
        required: false
        type: string
        default: ""
      rust-toolchain:
        required: false
        type: string
        default: "stable"
      python-version:
        required: false
        type: string
        default: "3.12"
      java-version:
        required: false
        type: string
        default: "21"
      dotnet-version:
        required: false
        type: string
        default: "8.0.x"
      toolchain-preset:
        description: "Run the engine's install/lint/build/test preset for the language instead of build/test/lint commands"
        required: false
        type: boolean
        default: false
      stages:
        description: "Preset mode: comma separated subset of install,configure,lint,build,test"
        required: false
        type: string
        default: ""
      skip-stages:
        description: "Preset mode: comma separated stages to skip"
        required: false
        type: string
        default: ""
      pipeline-task:
        description: "Run a task from the caller's pipeline.toml instead of build/test/lint commands"
        required: false
        type: string
        default: ""
      pipeline-ref:
        description: "Branch, tag, or commit of m-mdy-m/pipeline used for the task engine"
        required: false
        type: string
        default: "main"
      cache:
        description: "Enable package-manager and toolchain caches when a lock or dependency file is supplied"
        required: false
        type: boolean
        default: true
      python-cache-dependency-path:
        description: "Workspace-relative requirements or project metadata file used to key pip cache"
        required: false
        type: string
        default: ""
      latex-setup-mode:
        description: "install provisions TeX Live; verify checks a preinstalled toolchain"
        required: false
        type: string
        default: install
      latex-packages-file:
        description: "Workspace-relative apt package manifest (one package or package=version per line)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    # Rust currently runs on the known-good Ubuntu 24.04 image while
    # Ubuntu 26.04 compatibility is validated independently.
    runs-on: ${{ inputs.language == 'rust' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate reusable workflow inputs
        env:
          LANGUAGE: ${{ inputs.language }}
          BUILD_COMMAND: ${{ inputs.build-command }}
          TEST_COMMAND: ${{ inputs.test-command }}
          PIPELINE_TASK: ${{ inputs.pipeline-task }}
          TOOLCHAIN_PRESET: ${{ inputs.toolchain-preset }}
          LATEX_SETUP_MODE: ${{ inputs.latex-setup-mode }}
        shell: bash
        run: |
          set -euo pipefail
          case "$LANGUAGE" in
            go|node|rust|python|java|dotnet|c|latex|docker|custom) ;;
            *) echo "Unsupported language: $LANGUAGE" >&2; exit 2 ;;
          esac
          case "$LATEX_SETUP_MODE" in
            install|verify) ;;
            *) echo "latex-setup-mode must be install or verify" >&2; exit 2 ;;
          esac

          if [ -n "$PIPELINE_TASK" ] && [ "$TOOLCHAIN_PRESET" = "true" ]; then
            echo "Use either pipeline-task or toolchain-preset, not both" >&2
            exit 2
          fi

          if [ "$TOOLCHAIN_PRESET" = "true" ]; then
            :
          elif [ -z "$PIPELINE_TASK" ]; then
            test -n "$BUILD_COMMAND" || { echo "build-command must not be empty" >&2; exit 1; }
            test -n "$TEST_COMMAND" || { echo "test-command must not be empty" >&2; exit 1; }
          else
            [[ "$PIPELINE_TASK" =~ ^[A-Za-z0-9_-]+$ ]] || {
              echo "pipeline-task must be a simple task name" >&2
              exit 2
            }
          fi

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Set up Node.js
        if: inputs.language == 'node' || inputs.setup-node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Activate pnpm
        if: inputs.setup-node && inputs.pnpm-version != ''
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Set up Rust
        if: inputs.language == 'rust'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Set up Java
        if: inputs.language == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up .NET
        if: inputs.language == 'dotnet'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Prepare TeX package archive cache
        if: inputs.language == 'latex' && inputs.cache && inputs.latex-setup-mode == 'install' && inputs.latex-packages-file != '' && hashFiles(inputs.latex-packages-file) != ''
        shell: bash
        env:
          LATEX_PACKAGES_FILE: ${{ inputs.latex-packages-file }}
        run: |
          set -euo pipefail
          test -f "$LATEX_PACKAGES_FILE" || { echo "LaTeX package manifest not found: $LATEX_PACKAGES_FILE" >&2; exit 2; }
          sudo install -d -m 0755 /var/cache/apt/archives/partial
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache TeX package archives
        if: inputs.language == 'latex' && inputs.cache && inputs.latex-setup-mode == 'install' && inputs.latex-packages-file != '' && hashFiles(inputs.latex-packages-file) != ''
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: pipeline-texlive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.latex-packages-file) }}

      - name: Set up LaTeX (English and Persian)
        if: inputs.language == 'latex'
        shell: bash
        env:
          LATEX_SETUP_MODE: ${{ inputs.latex-setup-mode }}
          LATEX_PACKAGES_FILE: ${{ inputs.latex-packages-file }}
        run: |
          set -euo pipefail
          case "$LATEX_SETUP_MODE" in
            install)
              if [[ -n "$LATEX_PACKAGES_FILE" ]]; then
                [[ -f "$LATEX_PACKAGES_FILE" ]] || { echo "LaTeX package manifest not found: $LATEX_PACKAGES_FILE" >&2; exit 2; }
                mapfile -t packages < <(sed 's/#.*$//' "$LATEX_PACKAGES_FILE" | awk 'NF')
                (("${#packages[@]}" > 0)) || { echo "LaTeX package manifest is empty: $LATEX_PACKAGES_FILE" >&2; exit 2; }
                for package in "${packages[@]}"; do
                  [[ "$package" =~ ^[A-Za-z0-9][A-Za-z0-9+.-]*(=[^[:space:]]+)?$ ]] || {
                    echo "Invalid apt package entry in $LATEX_PACKAGES_FILE: $package" >&2
                    exit 2
                  }
                done
              else
                packages=(latexmk biber texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-bibtex-extra texlive-science texlive-xetex texlive-luatex texlive-lang-arabic texlive-fonts-recommended fonts-liberation fonts-noto fonts-vazirmatn fontconfig)
              fi
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends "${packages[@]}"
              sudo fc-cache -f >/dev/null 2>&1 || true
              ;;
            verify)
              echo "Using the preinstalled LaTeX toolchain; package installation is disabled."
              ;;
          esac
          for tool in latexmk pdflatex biber kpsewhich; do
            command -v "$tool" >/dev/null || { echo "Required LaTeX tool is missing: $tool" >&2; exit 1; }
          done
          kpsewhich biblatex.sty
          kpsewhich chicago-notes.bbx
          kpsewhich chicago-notes.cbx
          kpsewhich algorithm.sty
          kpsewhich algpseudocode.sty

      - name: Set up Python (project runtime and engine)
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.cache && inputs.python-cache-dependency-path != '' && hashFiles(inputs.python-cache-dependency-path) != '' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.python-cache-dependency-path }}

      - name: Check out the shared pipeline engine
        uses: actions/checkout@v7
        with:
          repository: m-mdy-m/pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies through the shared engine
        if: ${{ !inputs.toolchain-preset && (inputs.language == 'node' || (inputs.language == 'python' && hashFiles(format('{0}/requirements.txt', inputs.working-directory)) != '')) }}
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.pipeline/src
          LANGUAGE: ${{ inputs.language }}
          PROJECT_DIR: ${{ inputs.working-directory }}
        run: python -m pipeline.providers.github ci --root "$PROJECT_DIR" --language "$LANGUAGE" --stages install

      - name: Run the caller's pipeline.toml task
        if: inputs.pipeline-task != ''
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.pipeline/src
          PIPELINE_TASK: ${{ inputs.pipeline-task }}
        run: >-
          python -m pipeline.providers.github task "$PIPELINE_TASK"
          --root "$GITHUB_WORKSPACE"
          --config "$GITHUB_WORKSPACE/pipeline.toml"
          --json

      - name: Run the language preset through the shared engine
        if: inputs.toolchain-preset
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.pipeline/src
          LANGUAGE: ${{ inputs.language }}
          PROJECT_DIR: ${{ inputs.working-directory }}
          STAGES: ${{ inputs.stages }}
          SKIP_STAGES: ${{ inputs.skip-stages }}
        run: |
          set -euo pipefail
          args=(ci --root "$PROJECT_DIR" --language "$LANGUAGE")
          [[ -z "$STAGES" ]] || args+=(--stages "$STAGES")
          [[ -z "$SKIP_STAGES" ]] || args+=(--skip "$SKIP_STAGES")
          python -m pipeline.providers.github "${args[@]}"

      - name: Build
        if: inputs.pipeline-task == '' && !inputs.toolchain-preset
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -e -o pipefail -c "$COMMAND"

      - name: Test
        if: inputs.pipeline-task == '' && !inputs.toolchain-preset
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -e -o pipefail -c "$COMMAND"

      - name: Lint
        if: inputs.pipeline-task == '' && !inputs.toolchain-preset && inputs.lint-command != ''
        env:
          COMMAND: ${{ inputs.lint-command }}
        run: bash -e -o pipefail -c "$COMMAND"
