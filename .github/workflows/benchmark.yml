name: Benchmark

on:
  workflow_call:
    inputs:
      pipeline-ref:
        description: "Version or commit of m-mdy-m/pipeline that provides the benchmark runner"
        required: false
        type: string
        default: main
      benchmark-command:
        description: "Command to measure; executed by the shared benchmark script"
        required: true
        type: string
      category:
        description: "micro, throughput, latency, memory, startup, scalability, regression, or size"
        required: true
        type: string
      repetitions:
        required: false
        type: number
        default: 5
      working-directory:
        required: false
        type: string
        default: "."
      setup-command:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project being measured
        uses: actions/checkout@v7

      - name: Check out the shared benchmark runner
        uses: actions/checkout@v7
        with:
          repository: m-mdy-m/pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the provider-neutral benchmark
        env:
          BENCHMARK_COMMAND: ${{ inputs.benchmark-command }}
          BENCHMARK_CATEGORY: ${{ inputs.category }}
          BENCHMARK_REPETITIONS: ${{ inputs.repetitions }}
          BENCHMARK_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          BENCHMARK_SETUP_COMMAND: ${{ inputs.setup-command }}
        shell: bash
        run: |
          set -euo pipefail
          python .pipeline/scripts/benchmark.py \
            --command "$BENCHMARK_COMMAND" \
            --category "$BENCHMARK_CATEGORY" \
            --repetitions "$BENCHMARK_REPETITIONS" \
            --working-directory "$BENCHMARK_WORKING_DIRECTORY" \
            --output-directory benchmark-results \
            --setup-command "$BENCHMARK_SETUP_COMMAND"

      - name: Add the benchmark report to the run summary
        if: always()
        shell: bash
        env:
          RESULTS_DIRECTORY: ${{ inputs.working-directory }}/benchmark-results
        run: |
          if [ -f "$RESULTS_DIRECTORY/summary.md" ]; then
            cat "$RESULTS_DIRECTORY/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results-${{ github.run_id }}-${{ inputs.category }}
          path: ${{ inputs.working-directory }}/benchmark-results/
          if-no-files-found: warn
          retention-days: 30
