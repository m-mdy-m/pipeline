name: Python compatibility

on:
  workflow_call:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # macOS and Windows runs are informative until they have a clean history.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - os: macos-latest
            python-version: "3.12"
            experimental: true
          - os: windows-latest
            python-version: "3.12"
            experimental: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Compile and run the complete unit suite
        uses: ./.github/actions/python-quality
        with:
          python-version: ${{ matrix.python-version }}
          source-path: src
          tests-path: tests
          test-pattern: "test_*.py"
