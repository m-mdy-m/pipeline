name: Python compatibility

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/actions/python-quality/**"
      - ".github/workflows/python-compatibility.yml"
      - "pyproject.toml"
      - "pipeline.toml"
      - "Makefile"
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/actions/python-quality/**"
      - ".github/workflows/python-compatibility.yml"
      - "pyproject.toml"
      - "pipeline.toml"
      - "Makefile"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Compile and run the complete unit suite
        uses: ./.github/actions/python-quality
        with:
          python-version: ${{ matrix.python-version }}
          source-path: src
          tests-path: tests
          test-pattern: "test_*.py"
