name: SDK Image Example

on:
  workflow_dispatch:

jobs:
  sdk-image:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: example-owner/example-sdk
      dockerfile: Dockerfile.sdk
      sdk-image: true
    secrets:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      token: ${{ secrets.DOCKERHUB_TOKEN }}
