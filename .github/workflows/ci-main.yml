name: Repository CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: ./.github/workflows/docs-check.yml
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check required files and workflow inventory
        run: make docs-check workflow-inventory
      - name: Execute the shared task graph through the GitHub adapter
        run: python scripts/providers/github/adapter.py task check --json --result .pipeline-artifacts/pipeline-result.json
      - name: Upload the provider-neutral task report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-task-report-${{ github.run_id }}
          path: .pipeline-artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Check whitespace
        run: git diff --check
