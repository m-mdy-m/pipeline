name: Repository CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: ./.github/workflows/docs-check.yml
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check required files and workflow inventory
        run: make docs-check workflow-inventory
      - name: Execute shared task graph through GitHub provider adapter
        run: python scripts/providers/github/adapter.py run run check --json --result .pipeline-artifacts/pipeline-result.json
      - name: Check whitespace
        run: git diff --check
