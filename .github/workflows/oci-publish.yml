name: OCI Package Publish

on:
  workflow_call:
    inputs:
      pipeline-ref:
        description: "Branch, tag, or commit of m-mdy-m/pipeline used by the package helper"
        required: false
        type: string
        default: main
      package-name:
        description: "Lowercase GHCR package repository name, without an owner or registry host"
        required: true
        type: string
      component-id:
        description: "Provider-neutral component identity recorded in package metadata"
        required: true
        type: string
      variant:
        description: "Component variant, such as default, tui, or gui-sdl"
        required: false
        type: string
        default: default
      version:
        description: "SemVer package version; defaults to v-prefixed tag version on tag builds"
        required: false
        type: string
        default: ""
      source-repository:
        description: "HTTPS source repository URL; defaults to the calling repository"
        required: false
        type: string
        default: ""
      source-revision:
        description: "Full source Git object ID; defaults to the calling commit"
        required: false
        type: string
        default: ""
      setup-command:
        description: "Optional project-owned setup command executed before tests and build"
        required: false
        type: string
        default: ""
      test-command:
        description: "Optional project-owned test command; tests run before packaging"
        required: false
        type: string
        default: ""
      build-command:
        description: "Project-owned command that creates the package file"
        required: true
        type: string
      artifact-test-command:
        description: "Optional command to inspect the built package before publishing"
        required: false
        type: string
        default: ""
      artifact-path:
        description: "Path or glob that must resolve to exactly one regular package file"
        required: false
        type: string
        default: "dist/*.tar.gz"
      artifact-media-type:
        description: "OCI layer media type for the package file"
        required: false
        type: string
        default: "application/vnd.pipeline.package.layer.v1.tar+gzip"
      build-matrix-json:
        description: "JSON include matrix; each target needs id, os, target_os, architecture, and abi"
        required: false
        type: string
        default: '{"include":[{"id":"linux-amd64","os":"ubuntu-24.04","target_os":"linux","architecture":"x86_64","abi":"gnu"}]}'
      oras-version:
        description: "Pinned ORAS CLI version installed by setup-oras"
        required: false
        type: string
        default: "1.3.5"
      dry-run:
        description: "Build and verify package metadata without authenticating or pushing to GHCR"
        required: false
        type: boolean
        default: false
      allow-branch-publish:
        description: "Explicitly allow GHCR publication from the dedicated OCI integration branch"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      inputs.dry-run == true ||
      startsWith(github.ref, 'refs/tags/v') ||
      (inputs.allow-branch-publish == true &&
       github.event_name == 'push' &&
       github.ref == 'refs/heads/feat/oci-artifacts-ghcr')
    name: Build and publish OCI package / ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/.pipeline/src
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.build-matrix-json) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the component repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the shared Pipeline engine
        uses: actions/checkout@v7
        with:
          repository: m-mdy-m/pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: ./.pipeline/.github/actions/python-setup
        with:
          python-version: "3.12"

      - name: Validate package identity and target matrix
        id: validate
        shell: bash
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
          PACKAGE_VERSION_INPUT: ${{ inputs.version }}
          COMPONENT_ID: ${{ inputs.component-id }}
          BUILD_MATRIX_JSON: ${{ inputs.build-matrix-json }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_NAME" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]] || {
            echo "package-name must be a lowercase GHCR repository name" >&2
            exit 2
          }
          [[ -n "$COMPONENT_ID" ]] || { echo "component-id must not be empty" >&2; exit 2; }
          python -m pipeline.oci.cli validate-matrix --value "$BUILD_MATRIX_JSON" >/dev/null

          package_version="$PACKAGE_VERSION_INPUT"
          if [[ -z "$package_version" && "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            package_version="${GITHUB_REF_NAME#v}"
          fi
          [[ -n "$package_version" ]] || {
            echo "version is required for non-tag and dry-run builds" >&2
            exit 2
          }
          python -m pipeline.oci.cli validate-version --value "$package_version" >/dev/null
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* && "$package_version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "version must match the v-prefixed Git tag exactly" >&2
            exit 2
          fi
          printf 'version=%s\n' "$package_version" >> "$GITHUB_OUTPUT"

      - name: Set up MSYS2 toolchain
        if: runner.os == 'Windows' && matrix.msys2_msystem != null
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys2_msystem }}
          path-type: inherit
          update: false
          install: pacman-contrib ${{ matrix.msys2_packages || '' }}

      - name: Set up ORAS
        if: inputs.dry-run != true
        uses: oras-project/setup-oras@v2.0.3
        with:
          version: ${{ inputs.oras-version }}

      - name: Run project setup
        if: inputs.setup-command != '' || matrix.setup_command != null
        shell: bash
        env:
          COMMAND: ${{ matrix.setup_command || inputs.setup-command }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$COMMAND"

      - name: Run project tests
        if: inputs.test-command != '' || matrix.test_command != null
        shell: bash
        env:
          COMMAND: ${{ matrix.test_command || inputs.test-command }}
          PIPELINE_TARGET_ID: ${{ matrix.id }}
          PIPELINE_TARGET_OS: ${{ matrix.target_os }}
          PIPELINE_TARGET_ARCH: ${{ matrix.architecture }}
          PIPELINE_TARGET_ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$COMMAND"

      - name: Build package
        shell: bash
        env:
          COMMAND: ${{ matrix.build_command || inputs.build-command }}
          PIPELINE_TARGET_ID: ${{ matrix.id }}
          PIPELINE_TARGET_OS: ${{ matrix.target_os }}
          PIPELINE_TARGET_ARCH: ${{ matrix.architecture }}
          PIPELINE_TARGET_ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$COMMAND"

      - name: Prepare package metadata
        id: package
        shell: bash
        env:
          ARTIFACT_GLOB: ${{ matrix.artifact_path || inputs.artifact-path }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/pipeline-oci
          PACKAGE_NAME: ${{ inputs.package-name }}
          COMPONENT_ID: ${{ inputs.component-id }}
          VARIANT: ${{ inputs.variant }}
          PACKAGE_VERSION: ${{ steps.validate.outputs.version }}
          SOURCE_REPOSITORY_INPUT: ${{ inputs.source-repository }}
          SOURCE_REVISION_INPUT: ${{ inputs.source-revision }}
          TARGET_ID: ${{ matrix.id }}
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.architecture }}
          TARGET_ABI: ${{ matrix.abi }}
          ARTIFACT_MEDIA_TYPE: ${{ inputs.artifact-media-type }}
        run: |
          set -euo pipefail
          source_repository="$SOURCE_REPOSITORY_INPUT"
          if [[ -z "$source_repository" ]]; then
            source_repository="https://github.com/$GITHUB_REPOSITORY"
          fi
          source_revision="$SOURCE_REVISION_INPUT"
          if [[ -z "$source_revision" ]]; then
            source_revision="$GITHUB_SHA"
          fi
          result_file="$RUNNER_TEMP/pipeline-oci-prepare.json"
          python -m pipeline.oci.cli prepare \
            --artifact "$ARTIFACT_GLOB" \
            --output-directory "$OUTPUT_DIRECTORY" \
            --package-name "$PACKAGE_NAME" \
            --component-id "$COMPONENT_ID" \
            --variant "$VARIANT" \
            --version "$PACKAGE_VERSION" \
            --source-repository "$source_repository" \
            --source-revision "$source_revision" \
            --target-id "$TARGET_ID" \
            --target-os "$TARGET_OS" \
            --architecture "$TARGET_ARCH" \
            --abi "$TARGET_ABI" \
            --media-type "$ARTIFACT_MEDIA_TYPE" > "$result_file"
          python - "$result_file" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"artifact_path={result['artifact_path']}\n")
              output.write(f"metadata_path={result['metadata_path']}\n")
              output.write(f"tag={result['tag']}\n")
              output.write(f"artifact_sha256={result['artifact_sha256']}\n")
              output.write(f"metadata_sha256={result['metadata_sha256']}\n")
          PY

      - name: Verify package bytes and metadata
        shell: bash
        env:
          ARTIFACT_PATH: ${{ steps.package.outputs.artifact_path }}
          METADATA_PATH: ${{ steps.package.outputs.metadata_path }}
        run: |
          set -euo pipefail
          python -m pipeline.oci.cli verify --metadata "$METADATA_PATH" --artifact "$ARTIFACT_PATH"

      - name: Test the packaged artifact
        if: inputs.artifact-test-command != '' || matrix.artifact_test_command != null
        shell: bash
        env:
          COMMAND: ${{ matrix.artifact_test_command || inputs.artifact-test-command }}
          PIPELINE_ARTIFACT_PATH: ${{ steps.package.outputs.artifact_path }}
          PIPELINE_PACKAGE_METADATA: ${{ steps.package.outputs.metadata_path }}
          PIPELINE_PACKAGE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$COMMAND"

      - name: Stage immutable package bytes and re-verify metadata
        id: stage
        shell: bash
        env:
          ARTIFACT_PATH: ${{ steps.package.outputs.artifact_path }}
          METADATA_PATH: ${{ steps.package.outputs.metadata_path }}
          EXPECTED_METADATA_SHA256: ${{ steps.package.outputs.metadata_sha256 }}
          STAGING_DIRECTORY: ${{ runner.temp }}/pipeline-oci-publish
          RESULT_PATH: ${{ runner.temp }}/pipeline-oci-stage.json
        run: |
          set -euo pipefail
          python -m pipeline.oci.cli stage \
            --metadata "$METADATA_PATH" \
            --artifact "$ARTIFACT_PATH" \
            --output-directory "$STAGING_DIRECTORY" \
            --expected-metadata-sha256 "$EXPECTED_METADATA_SHA256" > "$RESULT_PATH"
          python - "$RESULT_PATH" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"artifact_path={result['artifact_path']}\n")
          PY

      - name: Report dry-run package descriptor
        if: inputs.dry-run == true
        shell: bash
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
          PACKAGE_VERSION: ${{ steps.validate.outputs.version }}
          TARGET_ID: ${{ matrix.id }}
          TAG: ${{ steps.package.outputs.tag }}
          ARTIFACT_SHA256: ${{ steps.package.outputs.artifact_sha256 }}
        run: |
          {
            echo "## OCI package dry run"
            echo
            echo "- Package: $PACKAGE_NAME:$TAG"
            echo "- Version: $PACKAGE_VERSION"
            echo "- Target: $TARGET_ID"
            echo "- Payload SHA-256: $ARTIFACT_SHA256"
            echo "- Registry push: skipped"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GitHub Container Registry
        if: inputs.dry-run != true
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push OCI package to GHCR
        id: push
        if: inputs.dry-run != true
        shell: bash
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
          PACKAGE_VERSION: ${{ steps.validate.outputs.version }}
          SOURCE_REPOSITORY_INPUT: ${{ inputs.source-repository }}
          SOURCE_REVISION_INPUT: ${{ inputs.source-revision }}
          ARTIFACT_MEDIA_TYPE: ${{ inputs.artifact-media-type }}
          ARTIFACT_PATH: ${{ steps.stage.outputs.artifact_path }}
          METADATA_PATH: ${{ steps.package.outputs.metadata_path }}
          PACKAGE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          reference="ghcr.io/$owner/$PACKAGE_NAME:$PACKAGE_TAG"
          source_repository="$SOURCE_REPOSITORY_INPUT"
          if [[ -z "$source_repository" ]]; then source_repository="https://github.com/$GITHUB_REPOSITORY"; fi
          source_revision="$SOURCE_REVISION_INPUT"
          if [[ -z "$source_revision" ]]; then source_revision="$GITHUB_SHA"; fi
          oras push "$reference" \
            --artifact-type application/vnd.pipeline.package.v1 \
            --config "$METADATA_PATH:application/vnd.pipeline.package.config.v1+json" \
            --annotation "org.opencontainers.image.source=$source_repository" \
            --annotation "org.opencontainers.image.revision=$source_revision" \
            --annotation "org.opencontainers.image.version=$PACKAGE_VERSION" \
            --annotation "org.opencontainers.image.title=$PACKAGE_NAME" \
            "$ARTIFACT_PATH:$ARTIFACT_MEDIA_TYPE" \
            --format json > "$RUNNER_TEMP/pipeline-oci-push.json"

      - name: Create immutable OCI publication receipt
        if: inputs.dry-run != true
        shell: bash
        env:
          METADATA_PATH: ${{ steps.package.outputs.metadata_path }}
          PUSH_RESULT_PATH: ${{ runner.temp }}/pipeline-oci-push.json
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pipeline-oci-publication"
          python -m pipeline.oci.cli receipt \
            --metadata "$METADATA_PATH" \
            --push-result "$PUSH_RESULT_PATH" \
            --registry ghcr.io \
            --owner "$OWNER" > "$RUNNER_TEMP/pipeline-oci-publication/receipt.json"
          python - "$RUNNER_TEMP/pipeline-oci-publication/receipt.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          oci = receipt["oci"]
          summary = [
              "## OCI package published",
              "",
              f"- Package: `{receipt['package']['name']}:{receipt['package']['tag']}`",
              f"- Target: `{receipt['target']['id']}`",
              f"- Digest: `{oci['digest']}`",
              f"- Immutable reference: `{oci['immutable_reference']}`",
              "",
              "The immutable reference is the canonical package identity; the tag is a discovery alias.",
              "",
          ]
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write("\n".join(summary))
          PY

      - name: Pull the published package by immutable digest
        if: inputs.dry-run != true
        shell: bash
        env:
          RECEIPT_PATH: ${{ runner.temp }}/pipeline-oci-publication/receipt.json
          METADATA_PATH: ${{ steps.package.outputs.metadata_path }}
          PULL_DIRECTORY: ${{ runner.temp }}/pipeline-oci-roundtrip
          PUBLISHED_ARTIFACT_PATH: ${{ steps.stage.outputs.artifact_path }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/pipeline-oci-evidence
        run: |
          set -euo pipefail
          immutable_reference="$(python - "$RECEIPT_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["oci"]["immutable_reference"])
          PY
          )"
          artifact_name="$(python - "$METADATA_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["artifact"]["name"])
          PY
          )"
          mkdir -p "$PULL_DIRECTORY"
          oras pull "$immutable_reference" --output "$PULL_DIRECTORY"
          python -m pipeline.oci.cli verify \
            --metadata "$METADATA_PATH" \
            --artifact "$PULL_DIRECTORY/$artifact_name"
          python - "$EVIDENCE_DIRECTORY" "$PUBLISHED_ARTIFACT_PATH" "$METADATA_PATH" "$RECEIPT_PATH" "$PULL_DIRECTORY/$artifact_name" "$artifact_name" <<'PY'
          import hashlib
          import shutil
          import sys
          from pathlib import Path

          evidence = Path(sys.argv[1])
          if evidence.exists():
              raise SystemExit("Refusing to overwrite the OCI evidence directory")
          evidence.mkdir(parents=True)
          sources = (
              ("published-" + sys.argv[6], Path(sys.argv[2])),
              ("package-metadata.json", Path(sys.argv[3])),
              ("receipt.json", Path(sys.argv[4])),
              ("roundtrip-" + sys.argv[6], Path(sys.argv[5])),
          )
          written = []
          for name, source in sources:
              if source.is_symlink() or not source.is_file():
                  raise SystemExit(f"OCI evidence source is not a regular file: {source}")
              destination = evidence / name
              with source.open("rb") as reader, destination.open("xb") as writer:
                  shutil.copyfileobj(reader, writer, length=1024 * 1024)
              written.append(destination)
          checksums = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}"
              for path in written
          ]
          (evidence / "SHA256SUMS").write_text("\n".join(checksums) + "\n", encoding="utf-8")
          PY

      - name: Upload OCI package and round-trip evidence
        if: inputs.dry-run != true
        uses: actions/upload-artifact@v7
        with:
          name: oci-package-${{ matrix.id }}
          path: ${{ runner.temp }}/pipeline-oci-evidence/
          if-no-files-found: error
          retention-days: 30
