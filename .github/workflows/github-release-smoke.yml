name: GitHub Release Dry Run

on:
  push:
    branches: [main, develop]
    paths:
      - "CHANGELOG.md"
      - "Makefile"
      - "pipeline.toml"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/github-release-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-dry-run:
    name: Build and verify release assets without publishing
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      pipeline-ref: ${{ github.sha }}
      test-command: python scripts/providers/github/adapter.py task check --json
      build-command: |
        mkdir -p dist
        tar -czf dist/pipeline-workflow-catalog.tar.gz README.md LICENSE CHANGELOG.md .github/workflows docs psx.yml .gix/config
      artifact-path: dist/*
      working-directory: .
      changelog-path: CHANGELOG.md
      dry-run: true
