name: GitHub Release Dry Run

on:
  push:
    branches: [main, develop]
    paths:
      - "CHANGELOG.md"
      - "Makefile"
      - "pipeline.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/github-release-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-dry-run:
    name: Build and verify release assets without publishing
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      pipeline-ref: ${{ github.sha }}
      test-command: PYTHONPATH=src python -m pipeline.providers.github task check --json
      build-command: |
        mkdir -p dist
        tar -czf dist/pipeline-workflow-catalog.tar.gz README.md LICENSE CHANGELOG.md .github/workflows docs psx.yml .gix/config
      artifact-path: dist/*
      artifact-test-command: >-
        python -c 'import os; from pathlib import Path; files = list(Path(os.environ["PIPELINE_ARTIFACT_TEST_DIR"]).glob("pipeline-workflow-catalog.tar.gz")); assert files and files[0].stat().st_size > 0, "downloaded release archive is missing or empty"'
      working-directory: .
      changelog-path: CHANGELOG.md
      dry-run: true
