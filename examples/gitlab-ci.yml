# Copy this file to .gitlab-ci.yml in your project.
image: python:3.12

stages:
  - test

before_script:
  - git clone --depth 1 --branch main https://github.com/m-mdy-m/pipeline.git .pipeline

pipeline-check:
  stage: test
  script:
    - PYTHONPATH=.pipeline/src python -m pipeline.providers.gitlab run check --json
  artifacts:
    when: always
    paths:
      - .pipeline-artifacts/
    expire_in: 7 days
