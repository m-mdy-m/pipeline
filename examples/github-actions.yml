# Copy this file to .github/workflows/check.yml in your project.
name: Project checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: m-mdy-m/pipeline
          ref: main
          path: .pipeline
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the project's task graph
        run: PYTHONPATH=.pipeline/src python -m pipeline.providers.github task check --json
